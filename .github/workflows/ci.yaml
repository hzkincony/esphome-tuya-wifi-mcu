name: CI

on:
  push:
  pull_request:

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: make host-test

  config-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run configuration compatibility tests
        run: make config-test

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - arduino-mcu
          - arduino-module
          - esp-idf-mcu
          - esp-idf-module
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: make config-${{ matrix.fixture }}
      - name: Compile firmware
        run: make compile-${{ matrix.fixture }}
