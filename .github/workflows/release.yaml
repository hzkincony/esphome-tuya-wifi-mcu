name: Release

on:
  release:
    types: [published]

jobs:
  protocol-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run protocol tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tests/protocol/test_tuya_protocol.cpp \
            components/tuya_wifi_mcu/tuya_protocol.cpp \
            -o /tmp/test_tuya_protocol
          /tmp/test_tuya_protocol

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - arduino-mcu
          - arduino-module
          - esp-idf-mcu
          - esp-idf-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: python -m pip install "esphome==2026.8.0"
      - name: Compile firmware
        run: esphome compile tests/compile/${{ matrix.fixture }}.yaml

  release-zip:
    needs: [protocol-test, compile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: ZIP component directory
        run: |
          cd "${{ github.workspace }}/components"
          zip -r tuya_wifi_mcu.zip ./
      - name: Upload ZIP to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/components/tuya_wifi_mcu.zip
          asset_name: tuya_wifi_mcu.zip
          tag: ${{ github.ref }}
          overwrite: true
