esphome:
  name: tuya_wifi_mcu_idf_example
  friendly_name: Tuya WiFi MCU ESP-IDF Example

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../components

uart:
  id: tuya_mcu_uart
  tx_pin: GPIO33
  rx_pin: GPIO14
  baud_rate: 9600

tuya_wifi_mcu:
  product_id: "abcdefghijklmnop"
  mcu_version: "1.0.0"
  uart_id: tuya_mcu_uart
  wifi_control_mode: mcu
  wifi_reset_pin:
    number: GPIO5
    mode: INPUT_PULLUP
  wifi_led_pin: GPIO12

switch:
  - platform: template
    id: local_relay
    name: Local Relay
    optimistic: true

  - platform: tuya_wifi_mcu
    id: tuya_relay
    dp_id: 1
    bind_switch_id: local_relay
    internal: true
